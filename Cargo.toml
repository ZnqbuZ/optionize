[workspace]
resolver = "2"
members = [
    "optionize", "optionize-macros", "optionize/tests/fixtures/models",
    "optionize/tests/fixtures/downstream",
]

[workspace.package]
repository = "https://github.com/ZnqbuZ/optionize"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["builder", "config", "partial", "macro", "derive"]
categories = ["config", "rust-patterns"]

[workspace.dependencies]
optionize-macros = { version = "0.6.0", path = "optionize-macros" }

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true
